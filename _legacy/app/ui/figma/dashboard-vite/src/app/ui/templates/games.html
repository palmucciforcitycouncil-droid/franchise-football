{% extends "base.html" %}{% block body %}
<div class="card">
  <h2>Games — Season {{ season }} Week {{ week }}</h2>
  <table class="table">
    <thead><tr><th>ID</th><th>Home</th><th>Away</th><th>Score</th><th>Box</th></tr></thead>
    <tbody>
      {% for g in games %}
      <tr>
        <td>{{ g.id }}</td>
        <td>{{ teams[g.home_team_id].abbr }}</td>
        <td>{{ teams[g.away_team_id].abbr }}</td>
        <td>{{ g.home_score or '-' }} - {{ g.away_score or '-' }}</td>
        <td><a href="/box/{{ g.id }}">View</a></td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
