<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Franchise Football{% endblock %}</title>
  <style>
    :root {
      --bg: #0f1420;
      --panel: #161d2e;
      --border: #2a3450;
      --text: #e8ecf5;
      --muted: #8b95ad;
      --accent: #4f7cff;
      --gold: #d8b34a;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      background: var(--panel);
      border-bottom: 2px solid var(--gold);
      padding: 1rem 2rem;
    }
    header h1 {
      margin: 0;
      font-size: 1.3rem;
      letter-spacing: 0.02em;
    }
    header h1 span { color: var(--gold); }
    main {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    select, button {
      background: #1c2438;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
    }
    button {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    label { display: block; margin-bottom: 0.35rem; color: var(--muted); font-size: 0.9rem; }
    .row { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
    .scoreboard {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 1.8rem; font-weight: 700; margin-bottom: 1rem;
    }
    .scoreboard .vs { color: var(--muted); font-size: 1rem; }
    .winner { color: var(--gold); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    a { color: var(--accent); }
    details.drive { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.6rem; padding: 0; overflow: hidden; }
    details.drive summary {
      cursor: pointer; padding: 0.6rem 0.9rem; list-style: none;
      display: flex; justify-content: space-between; gap: 1rem;
      background: #1c2438;
    }
    details.drive summary::-webkit-details-marker { display: none; }
    details.drive summary::before { content: "▸ "; color: var(--muted); }
    details.drive[open] summary::before { content: "▾ "; }
    details.drive summary .drive-score { color: var(--muted); font-variant-numeric: tabular-nums; }
    table.playlog { font-size: 0.82rem; }
    table.playlog th, table.playlog td { padding: 0.3rem 0.6rem; }
    table.playlog td.dd { white-space: nowrap; color: var(--muted); }
    table.playlog td.defcall { color: var(--muted); font-size: 0.78rem; }
    table.playlog tr.outcome-touchdown td { color: var(--gold); font-weight: 600; }
    table.playlog tr.outcome-turnover td { color: #e0685f; }
    table.playlog tr.outcome-first_down td.desc { color: var(--text); font-weight: 600; }
    table.boxtable { margin-bottom: 1rem; }
    table.boxtable:last-child { margin-bottom: 0; }
    table.boxtable th:first-child, table.boxtable td:first-child { text-align: left; }
    table.boxtable th:not(:first-child), table.boxtable td:not(:first-child) { text-align: right; }
    tr.starter td:first-child { color: var(--gold); font-weight: 600; }
    nav.subnav { margin: -0.5rem 0 1.5rem; font-size: 0.9rem; }
    nav.subnav a { margin-right: 1rem; }
    td.depth-actions { white-space: nowrap; text-align: right; }
    td.depth-actions form { display: inline-block; margin-left: 0.25rem; }
    td.depth-actions button { padding: 0.15rem 0.5rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <header><h1>Franchise <span>Football</span></h1></header>
  <main>
    <nav class="subnav"><a href="/dashboard">Dashboard</a><a href="/">Simulate</a><a href="/season">Season</a><a href="/roster">Roster</a><a href="/depth-chart">Depth Chart</a><a href="/stats">Stats</a></nav>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
