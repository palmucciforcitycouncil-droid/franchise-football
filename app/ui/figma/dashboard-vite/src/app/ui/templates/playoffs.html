{% extends "base.html" %}{% block body %}
<div class="card">
  <div class="row" style="gap:6px; align-items:center">
    <div class="kv" style="grid-template-columns:100px 120px">
      <label>Season</label>
      <input id="season" class="input" value="{{ season or 2025 }}">
    </div>
    <button data-tab="AFC" class="btn red tab">AFC Bracket</button>
    <button data-tab="SB" class="btn gold tab">Super Bowl</button>
    <button data-tab="NFC" class="btn tab">NFC Bracket</button>
    <button id="refresh" class="btn gray" style="margin-left:auto">Refresh</button>
  </div>
</div>

<div id="status" class="card" style="margin-top:12px">
  <h2>Status</h2>
  <div id="msg">Loading…</div>
</div>

<div class="row" style="margin-top:12px">
  <div class="card" style="flex:2">
    <h2 id="roundTitle">Bracket</h2>
    <div id="bracket"></div>
  </div>
  <div class="card" style="flex:1">
    <h2>In The Hunt</h2>
    <div id="hunt"></div>
  </div>
</div>

<script type="module" src="/static/js/playoffs.js"></script>
{% endblock %}
