<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayByPlayBox Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #111; color: #fff; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 20px; background: #222; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PlayByPlayBox Test</h1>
        
        <div class="test-section">
            <h2>Play-by-Play Test</h2>
            <p>This should show the PlayByPlayBox component with autoscroll and polling functionality.</p>
            <div id="play-by-play-container"></div>
        </div>
        
        <div class="test-section">
            <h2>Manual API Test</h2>
            <button onclick="testAPI()">Test /last-game API</button>
            <div id="api-result" style="margin-top: 10px;"></div>
        </div>
    </div>
    
    <script src="js/PlayByPlayBox.js"></script>
    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        window.API_BASE = API_BASE;
        let playByPlayBox = null;
        
        // Initialize PlayByPlayBox when page loads
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Initializing PlayByPlayBox...');
            playByPlayBox = new PlayByPlayBox('play-by-play-container', { pollMs: 5000 });
        });
        
        async function testAPI() {
            try {
                const response = await fetch(`${API_BASE}/last-game`);
                const data = await response.json();
                const plays = data?.result?.plays ?? [];
                
                document.getElementById('api-result').innerHTML = `
                    <div style="background: #333; padding: 10px; border-radius: 3px;">
                        <strong>API Response:</strong><br>
                        Plays count: ${plays.length}<br>
                        Week: ${data.week || 'N/A'}<br>
                        Timestamp: ${data.timestamp || 'N/A'}<br>
                        <br>
                        <strong>First 3 plays:</strong><br>
                        ${plays.slice(0, 3).map(p => `[Q${p.quarter} ${p.clock}] ${p.down}&${p.distance} @ ${p.yardline} — ${p.desc}`).join('<br>')}
                    </div>
                `;
            } catch (error) {
                document.getElementById('api-result').innerHTML = `
                    <div style="background: #f44336; padding: 10px; border-radius: 3px;">
                        Error: ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
