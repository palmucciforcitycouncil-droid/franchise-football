<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Franchise Football — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="/static/css/dashboard.css" rel="stylesheet" />
</head>
<body class="bg">
  <header class="nav">
    <div class="brand">Franchise Football</div>
    <nav class="nav-links">
      <a href="/" class="active">Home</a>
      <a href="/roster">Roster</a>
      <a href="#">Playoffs</a>
      <a href="#">Stats</a>
      <a href="#">Staff</a>
      <a href="#">GM Desk</a>
      <a href="#">Draft</a>
      <a href="#">HOF</a>
    </nav>
  </header>

  <section class="toolbar">
    <div class="team">New England Patriots</div>
    <div class="actions">
      <button class="btn">Sim Week</button>
      <button class="btn btn-ghost">Week 1</button>
      <button class="btn btn-ghost">Depth Chart</button>
    </div>
  </section>

  <main id="dash" class="grid">
    <!-- C1 column -->
    <section id="standings-card" class="card" data-area="c1-standings"></section>
    <section id="power-card" class="card" data-area="c1-power"></section>
    <section id="league-perf-card" class="card" data-area="c1-perf"></section>

    <!-- C2 column -->
    <section id="schedule-card" class="card scroll" data-area="c2-schedule"></section>
    <!-- SPAN across C2 + C3 -->
    <section id="box-score-card" class="card" data-area="span-boxscore"></section>
    <section id="pbp-card" class="card scroll" data-area="c2-pbp"></section>

    <!-- C3 column -->
    <section id="scouting-card" class="card" data-area="c3-scout"></section>
    <section id="team-perf-card" class="card" data-area="c3-teamperf"></section>
  </main>

  <footer class="footer">
    <span>Dashboard v3 Grid Layout</span>
  </footer>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
