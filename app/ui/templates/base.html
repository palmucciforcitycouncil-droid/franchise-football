<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>{% block title %}Franchise Football{% endblock %}</title>
  <link rel="stylesheet" href="/static/base.css">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;padding:0;background:#0b0e14;color:#e6e6e6}
    header,footer{background:#111520;padding:12px 16px}
    main{padding:16px}
    a{color:#8ab4ff;text-decoration:none}
    .grid{display:grid;gap:16px}
    .card{background:#151a28;border:1px solid #222a3a;border-radius:12px;padding:16px}
    h1,h2,h3{margin:8px 0 12px}
    pre{white-space:pre-wrap;word-wrap:break-word;background:#0f1320;border-radius:8px;padding:12px;overflow:auto}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #232a3a;padding:8px;text-align:left}
    .muted{opacity:0.75}
  </style>
</head>
<body>
<header>
  <strong>Franchise Football</strong> â€”
  <a href="/">Home</a> Â·
  <a href="/season">Season</a> Â·
  <a href="/power">Power</a> Â·
  <a href="/awards">Awards</a> Â·
  <a href="/playoffs">Playoffs</a>
</header>
<main>
  {% block content %}{% endblock %}
</main>
<footer class="muted">Debug UI â€¢ MVP</footer>
<!-- Debug order + availability -->
<script src="/static/js/ff-probe.js?v=probe-1.0" defer></script>
<script src="/static/js/ff-route-nudge.js?v=1"></script>
<script src="/static/js/ff-roster-driver.js?v=rollback-v32"></script>
<!-- Emergency revive: safe to keep; delete once native roster is solid -->
<!-- Hard-mount roster no matter what (remove after native fix) -->
<!-- Force Roster shell + fallback table on /roster (safe to keep) -->
<!-- FF proof-of-life + inline roster fallback -->
<div id="ff-ui-boot-badge" style="position:fixed;right:12px;bottom:12px;z-index:2147483647;font:12px/1.2 ui-monospace,Consolas;color:#cbd5e1;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:6px 8px;opacity:.9">FF UI Boot inline-v1</div>
<script>
(function(){
  const LOG='[ff-inline-roster]';
  function onRosterRoute(){
    const p=location.pathname.toLowerCase(), h=(location.hash||'').toLowerCase();
    return p.endsWith('/roster') || h.includes('roster');
  }
  function host(){
    return document.querySelector('#app-root')||document.querySelector('main')||document.querySelector('#content')||document.body;
  }
  function ensureShell(){
    if (document.getElementById('page-roster')) return true;
    const h=host(); if(!h) return false;
    const el=document.createElement('section');
    el.id='page-roster'; el.dataset.testid='page-roster'; el.className='page roster-page';
    el.innerHTML = `
      <header class="mb-3"><h2 class="text-lg font-semibold">Roster</h2></header>
      <div class="grid grid-cols-12 gap-4">
        <section class="col-span-12">
          <div class="flex items-center gap-2 mb-2">
            <button id="btn-auto-assign" data-action="auto-assign" class="btn">Auto Assign</button>
            <button id="btn-undo-assign" data-action="undo-assign" class="btn btn-secondary">Undo</button>
          </div>
          <section id="roster-main" class="card panel min-h-[360px]" data-roster-root></section>
        </section>
        <section class="col-span-12">
          <h3 class="text-base font-semibold mb-2">Depth Chart</h3>
          <div class="grid grid-cols-12 gap-4">
            <section id="depth-offense"  class="col-span-12 card panel min-h-[220px]" data-depth-offense></section>
            <section id="depth-defense"  class="col-span-12 card panel min-h-[220px]" data-depth-defense></section>
            <section id="depth-special"  class="col-span-12 card panel min-h-[180px]" data-depth-special></section>
          </div>
        </section>
      </div>`;
    h.appendChild(el);
    el.addEventListener('click',(e)=>{
      const a=e.target?.dataset?.action;
      if(a==='auto-assign') window.dispatchEvent(new CustomEvent('ff:depth:autoAssign'));
      if(a==='undo-assign')  window.dispatchEvent(new CustomEvent('ff:depth:undo'));
    });
    console.info(LOG,'shell mounted');
    window.dispatchEvent(new Event('ff:roster:rendered'));
    return true;
  }
  async function getRoster(){
    try{
      if (typeof window.uiAdapters?.roster?.getTeamRoster==='function') return await window.uiAdapters.roster.getTeamRoster();
      if (window.FF?.data?.activeTeamRoster) return window.FF.data.activeTeamRoster;
      if (window.FF?.data?.demo?.roster) return window.FF.data.demo.roster;
    }catch(_){}
    return [
      { id:'qb_1', name:'Alex Carter', pos:'QB', ovr:74 },
      { id:'rb_1', name:'Miles Stone', pos:'RB', ovr:71 },
      { id:'wr_1', name:'Jay Banks',   pos:'WR', ovr:73 },
      { id:'te_1', name:'D. Clark',    pos:'TE', ovr:69 },
      { id:'k_1',  name:'K. Hale',     pos:'K',  ovr:68 },
    ];
  }
  async function renderFallback(){
    const root=document.querySelector('#roster-main[data-roster-root]');
    if(!root){ console.warn(LOG,'no #roster-main'); return; }
    if(root.dataset.rendered==='native'||root.querySelector('table')){ console.info(LOG,'native/table present; skip'); return; }
    const roster=await getRoster();
    const rows=(roster||[]).map(p=>`<tr>
      <td class="sticky left-0 bg-base-200 px-2">${p.name || [p.first_name,p.last_name].filter(Boolean).join(' ')}</td>
      <td>${p.pos??''}</td><td>${p.ovr??''}</td></tr>`).join('');
    root.innerHTML=`
      <div class="mb-2 text-sm opacity-70">Roster (Inline Fallback)</div>
      <div class="overflow-auto border border-base-300 rounded">
        <table class="w-full min-w-[520px] text-sm">
          <thead><tr><th class="sticky left-0 bg-base-300 text-left px-2">Name</th><th>Pos</th><th>OVR</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    console.info(LOG,`fallback table rendered (${roster?.length||0} players)`);
  }
  function boot(){
    if(!onRosterRoute()) return;
    if(ensureShell()) renderFallback();
  }
  if (document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
  // SPA safety
  new MutationObserver(()=>{
    if(onRosterRoute() && !document.getElementById('page-roster')){
      if(ensureShell()) renderFallback();
    }
  }).observe(document.body,{childList:true,subtree:true});
})();
</script>
<!-- /FF proof-of-life + inline roster fallback -->

<!-- Console Rescue Script (backup emergency option) -->
<script src="/static/js/ff-console-rescue.js?v=rescue-1.0"></script>
</body>
</html>
